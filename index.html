<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Chronos Clock</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* ========================================
           RESET & BASE
        ======================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --pink: #ff2d78;
            --pink-glow: rgba(255, 45, 120, 0.5);
            --yellow: #ffd52e;
            --yellow-glow: rgba(255, 213, 46, 0.5);
            --green: #45ff75;
            --green-glow: rgba(69, 255, 117, 0.5);
            --cyan: #00d4ff;
            --purple: #a855f7;
            --bg: #03050c;
            --card: rgba(12, 18, 34, 0.7);
            --text: #ffffff;
            --muted: #8892a8;
            --border: rgba(255, 255, 255, 0.07);
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: "Orbitron", sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 16px;
            position: relative;
        }

        /* ========================================
           ANIMATED BACKGROUND
        ======================================== */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.18;
            animation: orbFloat 16s ease-in-out infinite alternate;
        }

        .bg .orb:nth-child(1) {
            width: 480px;
            height: 480px;
            background: var(--pink);
            top: -180px;
            left: -180px;
            animation-duration: 18s;
        }
        .bg .orb:nth-child(2) {
            width: 420px;
            height: 420px;
            background: var(--cyan);
            right: -160px;
            top: 20%;
            animation-duration: 20s;
            animation-delay: 2s;
        }
        .bg .orb:nth-child(3) {
            width: 380px;
            height: 380px;
            background: var(--green);
            bottom: -180px;
            left: 25%;
            animation-duration: 22s;
            animation-delay: 4s;
        }
        .bg .orb:nth-child(4) {
            width: 280px;
            height: 280px;
            background: var(--purple);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-duration: 24s;
            animation-delay: 1s;
            opacity: 0.10;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(50px, -40px) scale(1.12);
            }
            66% {
                transform: translate(-30px, 35px) scale(0.95);
            }
            100% {
                transform: translate(35px, -25px) scale(1.06);
            }
        }

        .bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.012) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.012) 1px, transparent 1px);
            background-size: 55px 55px;
        }

        /* ========================================
           WRAPPER
        ======================================== */
        .wrap {
            position: relative;
            z-index: 2;
            width: min(1320px, 100%);
            text-align: center;
            padding: 16px 12px 28px;
        }

        /* ========================================
           HEADER
        ======================================== */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            animation: fadeDown 1s ease forwards;
        }

        .header .row {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .header .line {
            width: 70px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--muted), transparent);
            opacity: 0.3;
        }

        .header h1 {
            font-size: clamp(1.5rem, 4.2vw, 3.4rem);
            font-weight: 700;
            letter-spacing: 16px;
            background: linear-gradient(135deg, var(--pink), var(--purple), var(--cyan), var(--green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 40px rgba(255, 45, 120, 0.12));
            text-transform: uppercase;
        }

        .header .sub {
            font-size: clamp(0.45rem, 0.9vw, 0.65rem);
            letter-spacing: 10px;
            color: var(--muted);
            text-transform: uppercase;
            opacity: 0.65;
            font-weight: 400;
        }

        /* ========================================
           DATE
        ======================================== */
        .date {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin-bottom: 30px;
            padding: 10px 26px;
            border-radius: 40px;
            background: rgba(12, 18, 34, 0.5);
            border: 1px solid var(--border);
            backdrop-filter: blur(12px);
            font-size: clamp(0.5rem, 0.85vw, 0.7rem);
            letter-spacing: 3px;
            color: var(--muted);
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            animation: fadeDown 1.2s ease forwards;
        }

        .date .sep {
            color: rgba(255, 255, 255, 0.10);
        }
        .date .day {
            color: var(--cyan);
            font-weight: 600;
            text-shadow: 0 0 20px var(--cyan-glow);
        }
        .date .num {
            color: #fff;
            font-weight: 500;
        }

        /* ========================================
           CLOCK CONTAINER
        ======================================== */
        .clock-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(18px, 4vw, 60px);
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        /* ========================================
           CLOCK CARD
        ======================================== */
        .clock-card {
            position: relative;
            width: 230px;
            height: 230px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.4s ease;
            cursor: default;
        }

        /* Hover only on devices that support hover */
        @media (hover: hover) {
            .clock-card:hover {
                transform: translateY(-12px) scale(1.03);
            }
            .clock-card:hover .ring {
                border-color: rgba(255, 255, 255, 0.18);
                box-shadow: 0 0 60px var(--ring-shadow-hover);
            }
        }

        /* Focus styles for keyboard navigation */
        .clock-card:focus-visible {
            outline: 2px solid var(--color);
            outline-offset: 8px;
            border-radius: 50%;
        }

        .hours-card {
            --color: var(--pink);
            --glow: var(--pink-glow);
            --ring-shadow: 0 0 30px rgba(255, 45, 120, 0.16), 0 0 80px rgba(255, 45, 120, 0.07);
            --ring-shadow-hover: 0 0 60px rgba(255, 45, 120, 0.28), 0 0 120px rgba(255, 45, 120, 0.12);
        }
        .minutes-card {
            --color: var(--yellow);
            --glow: var(--yellow-glow);
            --ring-shadow: 0 0 30px rgba(255, 213, 46, 0.16), 0 0 80px rgba(255, 213, 46, 0.07);
            --ring-shadow-hover: 0 0 60px rgba(255, 213, 46, 0.28), 0 0 120px rgba(255, 213, 46, 0.12);
        }
        .seconds-card {
            --color: var(--green);
            --glow: var(--green-glow);
            --ring-shadow: 0 0 30px rgba(69, 255, 117, 0.16), 0 0 80px rgba(69, 255, 117, 0.07);
            --ring-shadow-hover: 0 0 60px rgba(69, 255, 117, 0.28), 0 0 120px rgba(69, 255, 117, 0.12);
        }

        .ring {
            width: 200px;
            height: 200px;
            position: relative;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 40%, rgba(20, 30, 55, 0.8), rgba(4, 7, 13, 0.95));
            border: 1.5px solid rgba(255, 255, 255, 0.07);
            box-shadow: inset 0 0 60px rgba(255, 255, 255, 0.02), var(--ring-shadow);
            transition: box-shadow 0.5s ease, border-color 0.4s ease;
        }

        /* Enhanced glow for browsers that support color-mix() */
        @supports (color: color-mix(in srgb, red, blue)) {
            .hours-card .ring {
                --ring-shadow: 0 0 30px color-mix(in srgb, var(--color), transparent 84%),
                                0 0 80px color-mix(in srgb, var(--color), transparent 93%);
                --ring-shadow-hover: 0 0 60px color-mix(in srgb, var(--color), transparent 72%),
                                     0 0 120px color-mix(in srgb, var(--color), transparent 84%);
            }
            .minutes-card .ring {
                --ring-shadow: 0 0 30px color-mix(in srgb, var(--color), transparent 84%),
                                0 0 80px color-mix(in srgb, var(--color), transparent 93%);
                --ring-shadow-hover: 0 0 60px color-mix(in srgb, var(--color), transparent 72%),
                                     0 0 120px color-mix(in srgb, var(--color), transparent 84%);
            }
            .seconds-card .ring {
                --ring-shadow: 0 0 30px color-mix(in srgb, var(--color), transparent 84%),
                                0 0 80px color-mix(in srgb, var(--color), transparent 93%);
                --ring-shadow-hover: 0 0 60px color-mix(in srgb, var(--color), transparent 72%),
                                     0 0 120px color-mix(in srgb, var(--color), transparent 84%);
            }
            .clock-value {
                text-shadow: 0 0 15px var(--color),
                             0 0 35px color-mix(in srgb, var(--color), transparent 50%),
                             0 0 70px color-mix(in srgb, var(--color), transparent 72%);
            }
        }

        /* Fallback for browsers that don't support color-mix */
        @supports not (color: color-mix(in srgb, red, blue)) {
            .hours-card .ring {
                --ring-shadow: 0 0 30px rgba(255, 45, 120, 0.16), 0 0 80px rgba(255, 45, 120, 0.07);
                --ring-shadow-hover: 0 0 60px rgba(255, 45, 120, 0.28), 0 0 120px rgba(255, 45, 120, 0.12);
            }
            .minutes-card .ring {
                --ring-shadow: 0 0 30px rgba(255, 213, 46, 0.16), 0 0 80px rgba(255, 213, 46, 0.07);
                --ring-shadow-hover: 0 0 60px rgba(255, 213, 46, 0.28), 0 0 120px rgba(255, 213, 46, 0.12);
            }
            .seconds-card .ring {
                --ring-shadow: 0 0 30px rgba(69, 255, 117, 0.16), 0 0 80px rgba(69, 255, 117, 0.07);
                --ring-shadow-hover: 0 0 60px rgba(69, 255, 117, 0.28), 0 0 120px rgba(69, 255, 117, 0.12);
            }
            .clock-value {
                text-shadow: 0 0 15px var(--color), 0 0 35px var(--color), 0 0 70px var(--color);
                opacity: 0.9; /* compensate for missing glow */
            }
        }

        .ring::before {
            content: "";
            position: absolute;
            inset: 12px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .ring::after {
            content: "";
            position: absolute;
            inset: 24px;
            border-radius: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.04);
            animation: spinRing 40s linear infinite;
            will-change: transform;
        }

        @keyframes spinRing {
            to {
                transform: rotate(360deg);
            }
        }

        /* ========================================
           SVG RINGS
        ======================================== */
        .ring svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
            overflow: visible;
            filter: drop-shadow(0 0 6px var(--color)) drop-shadow(0 0 18px var(--color));
        }

        .ring-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.06);
            stroke-width: 5;
        }

        .ring-progress {
            fill: none;
            stroke: var(--color);
            stroke-width: 5;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.12s linear;
            will-change: stroke-dashoffset;
        }

        /* ========================================
           TICKS
        ======================================== */
        .ticks {
            position: absolute;
            inset: 16px;
            border-radius: 50%;
            z-index: 3;
            pointer-events: none;
            /* origin set via JS as custom property */
            --tick-origin-y: 92px;
        }

        .tick {
            position: absolute;
            left: 50%;
            top: 0;
            width: 2px;
            height: 7px;
            background: var(--color);
            transform-origin: 50% var(--tick-origin-y, 92px);
            opacity: 0.30;
            border-radius: 2px;
            will-change: transform;
        }

        .tick.major {
            height: 11px;
            width: 3px;
            opacity: 0.55;
        }

        /* ========================================
           MOVING DOT
        ======================================== */
        .moving-dot {
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--color);
            box-shadow:
                0 0 14px var(--color),
                0 0 32px var(--color),
                0 0 60px var(--color);
            z-index: 10;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.15);
            will-change: transform;
            transition: box-shadow 0.3s ease;
        }

        @media (hover: hover) {
            .clock-card:hover .moving-dot {
                box-shadow:
                    0 0 22px var(--color),
                    0 0 50px var(--color),
                    0 0 80px var(--color);
            }
        }

        /* ========================================
           CLOCK TEXT
        ======================================== */
        .clock-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
            gap: 1px;
        }

        .clock-value {
            font-size: clamp(2.6rem, 4.6vw, 4rem);
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--color);
            line-height: 1;
            transition: transform 0.15s ease;
        }

        .clock-value.pulse {
            animation: numPulse 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes numPulse {
            0% {
                transform: scale(1);
            }
            40% {
                transform: scale(1.16);
            }
            100% {
                transform: scale(1);
            }
        }

        .clock-label {
            font-size: clamp(0.45rem, 0.65vw, 0.6rem);
            letter-spacing: 6px;
            color: var(--muted);
            font-weight: 400;
            opacity: 0.7;
            margin-top: 2px;
        }

        /* ========================================
           AM / PM
        ======================================== */
        .ampm {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 22px auto 28px;
            padding: 10px 34px;
            border-radius: 40px;
            background: rgba(12, 18, 34, 0.55);
            border: 1px solid var(--border);
            backdrop-filter: blur(12px);
            width: fit-content;
            font-size: clamp(0.65rem, 0.9vw, 0.85rem);
            letter-spacing: 5px;
            color: var(--muted);
            font-weight: 400;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.25);
        }

        .ampm #ampmLabel {
            color: #fff;
            font-weight: 600;
            min-width: 28px;
        }

        .dot-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff8c;
            box-shadow: 0 0 12px #00ff8c, 0 0 30px #00ff8c;
            animation: blinkDot 1.8s ease-in-out infinite;
        }

        @keyframes blinkDot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.2;
                transform: scale(0.8);
            }
        }

        /* ========================================
           FEATURES
        ======================================== */
        .features {
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 0;
            margin-top: 28px;
            padding: 18px 10px;
            border-radius: 28px;
            background: rgba(12, 18, 34, 0.45);
            border: 1px solid var(--border);
            backdrop-filter: blur(14px);
            flex-wrap: wrap;
        }

        .feature {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            min-width: 150px;
            padding: 10px 20px;
            border-right: 1px solid var(--border);
            transition: background 0.3s ease;
            border-radius: 4px;
        }
        .feature:last-child {
            border-right: none;
        }

        @media (hover: hover) {
            .feature:hover {
                background: rgba(255, 255, 255, 0.03);
            }
            .feature:hover .feature-icon {
                transform: scale(1.06);
                box-shadow: 0 0 30px rgba(255, 45, 120, 0.12);
            }
            .feature:nth-child(2):hover .feature-icon {
                box-shadow: 0 0 30px rgba(255, 213, 46, 0.12);
            }
            .feature:nth-child(3):hover .feature-icon {
                box-shadow: 0 0 30px rgba(69, 255, 117, 0.12);
            }
            .feature:nth-child(4):hover .feature-icon {
                box-shadow: 0 0 30px rgba(0, 212, 255, 0.12);
            }
        }

        .feature:focus-visible {
            outline: 2px solid var(--pink);
            outline-offset: 2px;
        }

        .feature-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid var(--pink);
            color: var(--pink);
            font-size: 1rem;
            background: rgba(255, 45, 120, 0.06);
            box-shadow: 0 0 20px rgba(255, 45, 120, 0.06);
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .feature:nth-child(2) .feature-icon {
            color: var(--yellow);
            border-color: var(--yellow);
            background: rgba(255, 213, 46, 0.06);
        }
        .feature:nth-child(3) .feature-icon {
            color: var(--green);
            border-color: var(--green);
            background: rgba(69, 255, 117, 0.06);
        }
        .feature:nth-child(4) .feature-icon {
            color: var(--cyan);
            border-color: var(--cyan);
            background: rgba(0, 212, 255, 0.06);
        }

        .feature div:last-child {
            display: flex;
            flex-direction: column;
            text-align: left;
            gap: 2px;
        }
        .feature span {
            font-size: clamp(0.45rem, 0.6vw, 0.6rem);
            letter-spacing: 2.5px;
            color: #fff;
            font-weight: 500;
        }
        .feature small {
            font-size: clamp(0.35rem, 0.45vw, 0.45rem);
            letter-spacing: 2px;
            color: var(--muted);
            opacity: 0.7;
        }

        /* ========================================
           ANIMATIONS
        ======================================== */
        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-22px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========================================
           RESPONSIVE
        ======================================== */
        @media (max-width: 900px) {
            .clock-card {
                width: 190px;
                height: 190px;
            }
            .ring {
                width: 168px;
                height: 168px;
            }
            .moving-dot {
                width: 14px;
                height: 14px;
            }
            .tick {
                height: 6px;
            }
            .tick.major {
                height: 10px;
            }
            .clock-value {
                font-size: clamp(2rem, 3.8vw, 3rem);
            }
            .header h1 {
                letter-spacing: 10px;
            }
            .header .line {
                width: 40px;
            }
            .features {
                padding: 14px 8px;
            }
            .feature {
                min-width: 120px;
                padding: 8px 14px;
                gap: 10px;
            }
            .feature-icon {
                width: 36px;
                height: 36px;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 650px) {
            body {
                padding: 8px;
                align-items: flex-start;
                padding-top: 20px;
            }
            .wrap {
                padding: 8px 4px 16px;
            }
            .header {
                margin-bottom: 18px;
            }
            .header h1 {
                font-size: 1.3rem;
                letter-spacing: 5px;
            }
            .header .line {
                width: 24px;
            }
            .header .sub {
                font-size: 0.4rem;
                letter-spacing: 5px;
            }
            .date {
                font-size: 0.45rem;
                padding: 6px 14px;
                gap: 8px;
                margin-bottom: 18px;
                letter-spacing: 2px;
            }
            .clock-container {
                flex-direction: column;
                gap: 16px;
            }
            .clock-card {
                width: 180px;
                height: 180px;
            }
            @media (hover: hover) {
                .clock-card:hover {
                    transform: translateY(-6px) scale(1.02);
                }
            }
            .ring {
                width: 160px;
                height: 160px;
            }
            .ring::before {
                inset: 10px;
            }
            .ring::after {
                inset: 20px;
            }
            .moving-dot {
                width: 13px;
                height: 13px;
            }
            .tick {
                height: 5px;
                width: 1.5px;
            }
            .tick.major {
                height: 9px;
                width: 2px;
            }
            .clock-value {
                font-size: 2rem;
            }
            .clock-label {
                font-size: 0.4rem;
                letter-spacing: 4px;
            }
            .ampm {
                padding: 6px 18px;
                gap: 12px;
                font-size: 0.6rem;
                margin: 14px auto 18px;
            }
            .dot-status {
                width: 6px;
                height: 6px;
            }
            .features {
                flex-direction: column;
                gap: 0;
                padding: 8px 4px;
                border-radius: 18px;
                margin-top: 14px;
            }
            .feature {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border);
                padding: 10px 14px;
                min-width: unset;
                justify-content: flex-start;
                gap: 14px;
            }
            .feature:last-child {
                border-bottom: none;
            }
            .feature-icon {
                width: 34px;
                height: 34px;
                font-size: 0.75rem;
            }
            .bg .orb {
                filter: blur(80px);
                opacity: 0.12;
            }
            .bg .orb:nth-child(1) {
                width: 280px;
                height: 280px;
                top: -80px;
                left: -80px;
            }
            .bg .orb:nth-child(2) {
                width: 240px;
                height: 240px;
                right: -80px;
            }
            .bg .orb:nth-child(3) {
                width: 240px;
                height: 240px;
                bottom: -80px;
            }
        }

        @media (max-width: 400px) {
            .clock-card {
                width: 150px;
                height: 150px;
            }
            .ring {
                width: 134px;
                height: 134px;
            }
            .moving-dot {
                width: 11px;
                height: 11px;
            }
            .tick {
                height: 4px;
            }
            .tick.major {
                height: 8px;
            }
            .clock-value {
                font-size: 1.6rem;
            }
            .clock-label {
                font-size: 0.35rem;
                letter-spacing: 3px;
            }
            .header h1 {
                font-size: 1rem;
                letter-spacing: 3px;
            }
            .header .row {
                gap: 10px;
            }
            .header .line {
                width: 16px;
            }
            .date {
                font-size: 0.38rem;
                padding: 4px 10px;
                gap: 5px;
            }
            .ampm {
                font-size: 0.5rem;
                padding: 4px 12px;
                gap: 8px;
            }
            .feature {
                padding: 8px 10px;
                gap: 10px;
            }
            .feature span {
                font-size: 0.4rem;
            }
            .feature small {
                font-size: 0.3rem;
            }
            .feature-icon {
                width: 28px;
                height: 28px;
                font-size: 0.65rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== BACKGROUND ===== -->
    <div class="bg" aria-hidden="true">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <!-- ===== MAIN ===== -->
    <main class="wrap">

        <!-- HEADER -->
        <header class="header">
            <div class="row">
                <span class="line"></span>
                <h1>Chronos</h1>
                <span class="line"></span>
            </div>
            <p class="sub">Time is precious · Use it wisely</p>
        </header>

        <!-- DATE -->
        <div class="date" id="dateDisplay">
            <span class="day" id="dateDay">MONDAY</span>
            <span class="sep">|</span>
            <span id="dateMonth">JAN</span>
            <span class="sep">|</span>
            <span class="num" id="dateNumber">01</span>
            <span class="sep">|</span>
            <span id="dateYear">2025</span>
        </div>

        <!-- CLOCK -->
        <section class="clock-container" role="group" aria-label="Clock display">

            <!-- HOURS -->
            <div class="clock-card hours-card" tabindex="0" role="img" aria-label="Hours">
                <div class="ring">
                    <svg viewBox="0 0 160 160" aria-hidden="true">
                        <circle class="ring-bg" cx="80" cy="80" r="72" />
                        <circle class="ring-progress" id="hour-ring" cx="80" cy="80" r="72" />
                    </svg>
                    <div class="ticks" id="hour-ticks"></div>
                    <div class="moving-dot" id="hour-dot"></div>
                    <div class="clock-content">
                        <span class="clock-value" id="hours" aria-live="polite">00</span>
                        <span class="clock-label">HOURS</span>
                    </div>
                </div>
            </div>

            <!-- MINUTES -->
            <div class="clock-card minutes-card" tabindex="0" role="img" aria-label="Minutes">
                <div class="ring">
                    <svg viewBox="0 0 160 160" aria-hidden="true">
                        <circle class="ring-bg" cx="80" cy="80" r="72" />
                        <circle class="ring-progress" id="minute-ring" cx="80" cy="80" r="72" />
                    </svg>
                    <div class="ticks" id="minute-ticks"></div>
                    <div class="moving-dot" id="minute-dot"></div>
                    <div class="clock-content">
                        <span class="clock-value" id="minutes" aria-live="polite">00</span>
                        <span class="clock-label">MINUTES</span>
                    </div>
                </div>
            </div>

            <!-- SECONDS -->
            <div class="clock-card seconds-card" tabindex="0" role="img" aria-label="Seconds">
                <div class="ring">
                    <svg viewBox="0 0 160 160" aria-hidden="true">
                        <circle class="ring-bg" cx="80" cy="80" r="72" />
                        <circle class="ring-progress" id="second-ring" cx="80" cy="80" r="72" />
                    </svg>
                    <div class="ticks" id="second-ticks"></div>
                    <div class="moving-dot" id="second-dot"></div>
                    <div class="clock-content">
                        <span class="clock-value" id="seconds" aria-live="polite">00</span>
                        <span class="clock-label">SECONDS</span>
                    </div>
                </div>
            </div>

        </section>

        <!-- AM / PM -->
        <div class="ampm">
            <span class="dot-status" aria-hidden="true"></span>
            <span id="ampmLabel">AM</span>
            <span class="dot-status" aria-hidden="true"></span>
        </div>

        <!-- FEATURES -->
        <section class="features">
            <div class="feature" tabindex="0">
                <div class="feature-icon">◷</div>
                <div>
                    <span>REAL TIME</span>
                    <small>PRECISE</small>
                </div>
            </div>
            <div class="feature" tabindex="0">
                <div class="feature-icon">⚡</div>
                <div>
                    <span>SMOOTH</span>
                    <small>60 FPS</small>
                </div>
            </div>
            <div class="feature" tabindex="0">
                <div class="feature-icon">✦</div>
                <div>
                    <span>NEON</span>
                    <small>GLOW UI</small>
                </div>
            </div>
            <div class="feature" tabindex="0">
                <div class="feature-icon">◉</div>
                <div>
                    <span>RESPONSIVE</span>
                    <small>ALL DEVICES</small>
                </div>
            </div>
        </section>

    </main>

    <!-- ===== SCRIPT ===== -->
    <script>
        (function() {
            'use strict';

            // --- DOM ---
            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');
            const secondsEl = document.getElementById('seconds');
            const ampmEl = document.getElementById('ampmLabel');

            const hourRing = document.getElementById('hour-ring');
            const minuteRing = document.getElementById('minute-ring');
            const secondRing = document.getElementById('second-ring');

            const hourDot = document.getElementById('hour-dot');
            const minuteDot = document.getElementById('minute-dot');
            const secondDot = document.getElementById('second-dot');

            const hourTicksContainer = document.getElementById('hour-ticks');
            const minuteTicksContainer = document.getElementById('minute-ticks');
            const secondTicksContainer = document.getElementById('second-ticks');

            const dateDay = document.getElementById('dateDay');
            const dateMonth = document.getElementById('dateMonth');
            const dateNumber = document.getElementById('dateNumber');
            const dateYear = document.getElementById('dateYear');

            // --- SVG constants ---
            const RING_RADIUS_SVG = 72;
            const VIEW_BOX = 160;
            const CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS_SVG;

            [hourRing, minuteRing, secondRing].forEach(r => {
                r.style.strokeDasharray = CIRCUMFERENCE;
                r.style.strokeDashoffset = CIRCUMFERENCE;
            });

            // --- Cached ring sizes for dot positioning ---
            const dotKeys = ['hour', 'minute', 'second'];
            const cachedSizes = { hour: 200, minute: 200, second: 200 };

            function updateCachedSizes() {
                const dots = [hourDot, minuteDot, secondDot];
                dots.forEach((dot, i) => {
                    const ring = dot.closest('.ring');
                    if (ring) {
                        cachedSizes[dotKeys[i]] = ring.getBoundingClientRect().width;
                    }
                });
            }

            // --- Tick building with dynamic transform-origin ---
            function buildTicks(container, count, majorStep) {
                const ring = container.closest('.ring');
                // we will set the origin via CSS custom property on the container
                // but we need the initial value; we'll compute it after build.
                for (let i = 0; i < count; i++) {
                    const t = document.createElement('span');
                    t.className = 'tick';
                    if (majorStep && i % majorStep === 0) t.classList.add('major');
                    t.style.transform = `rotate(${i * (360 / count)}deg)`;
                    container.appendChild(t);
                }
                // Set initial origin
                updateTickOrigins();
            }

            function updateTickOrigins() {
                const containers = [hourTicksContainer, minuteTicksContainer, secondTicksContainer];
                containers.forEach(container => {
                    const ring = container.closest('.ring');
                    if (!ring) return;
                    const size = ring.getBoundingClientRect().width;
                    // inset is 16px from each side (from .ticks style)
                    const ticksSize = size - 32; // 16px * 2
                    const originY = ticksSize / 2;
                    container.style.setProperty('--tick-origin-y', originY + 'px');
                });
            }

            // --- Build ticks ---
            buildTicks(hourTicksContainer, 12, 1);
            buildTicks(minuteTicksContainer, 60, 5);
            buildTicks(secondTicksContainer, 60, 5);

            // --- Helpers ---
            function pad(n) { return String(n).padStart(2, '0'); }

            function updateRing(ring, progress) {
                ring.style.strokeDashoffset = CIRCUMFERENCE - progress * CIRCUMFERENCE;
            }

            // --- Dot positioning using cached size ---
            function getDotRadius(key) {
                const size = cachedSizes[key] || 160;
                return RING_RADIUS_SVG * (size / VIEW_BOX);
            }

            function moveDot(dot, key, progress) {
                const radius = getDotRadius(key);
                const angle = progress * 360 - 90;
                const rad = angle * Math.PI / 180;
                const x = radius * Math.cos(rad);
                const y = radius * Math.sin(rad);
                dot.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
            }

            // --- Pulse ---
            let prevSecond = -1;

            function pulseNumber(el) {
                el.classList.remove('pulse');
                void el.offsetWidth;
                el.classList.add('pulse');
            }

            // --- Date ---
            const DAYS = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
            const MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

            // --- Main update ---
            let frameId = null;

            function updateClock() {
                const now = new Date();
                let h = now.getHours();
                const m = now.getMinutes();
                const s = now.getSeconds();
                const ms = now.getMilliseconds();

                const ampm = h >= 12 ? 'PM' : 'AM';
                const h12 = h % 12 || 12;

                hoursEl.textContent = pad(h12);
                minutesEl.textContent = pad(m);
                secondsEl.textContent = pad(s);
                ampmEl.textContent = ampm;

                // date
                dateDay.textContent = DAYS[now.getDay()];
                dateMonth.textContent = MONTHS[now.getMonth()];
                dateNumber.textContent = pad(now.getDate());
                dateYear.textContent = now.getFullYear();

                // progress
                const hp = ((h12 % 12) + m / 60 + s / 3600) / 12;
                const mp = (m + s / 60 + ms / 60000) / 60;
                const sp = (s + ms / 1000) / 60;

                updateRing(hourRing, hp);
                updateRing(minuteRing, mp);
                updateRing(secondRing, sp);

                moveDot(hourDot, 'hour', hp);
                moveDot(minuteDot, 'minute', mp);
                moveDot(secondDot, 'second', sp);

                if (s !== prevSecond) {
                    pulseNumber(secondsEl);
                    prevSecond = s;
                }

                frameId = requestAnimationFrame(updateClock);
            }

            // --- Init ---
            updateCachedSizes();
            updateTickOrigins();
            updateClock();

            // --- Resize handling (debounced) ---
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    updateCachedSizes();
                    updateTickOrigins();
                    // force dot reposition with current progress (read from rings)
                    const getProgress = (ring) => {
                        const offset = parseFloat(ring.style.strokeDashoffset) || CIRCUMFERENCE;
                        return (CIRCUMFERENCE - offset) / CIRCUMFERENCE;
                    };
                    moveDot(hourDot, 'hour', getProgress(hourRing));
                    moveDot(minuteDot, 'minute', getProgress(minuteRing));
                    moveDot(secondDot, 'second', getProgress(secondRing));
                }, 150);
            });

            // --- Cleanup on page unload (optional) ---
            window.addEventListener('beforeunload', () => {
                if (frameId) cancelAnimationFrame(frameId);
            });

        })();
    </script>

</body>
</html>
