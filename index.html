<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Neon Clock</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- Animated Background -->
    <div class="background">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <main class="clock-wrapper">

        <!-- Header -->
        <header class="header">

            <div class="header-line"></div>

            <h1>DIGITAL CLOCK</h1>

            <p>TIME IS PRECIOUS. USE IT WISELY.</p>

            <div class="header-line"></div>

        </header>


        <!-- Clock -->
        <section class="clock-container">

            <!-- HOURS -->
            <div class="clock-card hours-card">

                <div class="clock-ring">

                    <svg viewBox="0 0 160 160">

                        <circle
                            class="ring-bg"
                            cx="80"
                            cy="80"
                            r="72">
                        </circle>

                        <circle
                            class="ring-progress"
                            id="hour-ring"
                            cx="80"
                            cy="80"
                            r="72">
                        </circle>

                    </svg>

                    <div class="ticks" id="hour-ticks"></div>

                    <div class="moving-dot"></div>

                    <div class="clock-content">

                        <span class="clock-value" id="hours">
                            00
                        </span>

                        <span class="clock-label">
                            HOURS
                        </span>

                    </div>

                </div>

            </div>


            <!-- MINUTES -->
            <div class="clock-card minutes-card">

                <div class="clock-ring">

                    <svg viewBox="0 0 160 160">

                        <circle
                            class="ring-bg"
                            cx="80"
                            cy="80"
                            r="72">
                        </circle>

                        <circle
                            class="ring-progress"
                            id="minute-ring"
                            cx="80"
                            cy="80"
                            r="72">
                        </circle>

                    </svg>

                    <div class="ticks" id="minute-ticks"></div>

                    <div class="moving-dot"></div>

                    <div class="clock-content">

                        <span class="clock-value" id="minutes">
                            00
                        </span>

                        <span class="clock-label">
                            MINUTES
                        </span>

                    </div>

                </div>

            </div>


            <!-- SECONDS -->
            <div class="clock-card seconds-card">

                <div class="clock-ring">

                    <svg viewBox="0 0 160 160">

                        <circle
                            class="ring-bg"
                            cx="80"
                            cy="80"
                            r="72">
                        </circle>

                        <circle
                            class="ring-progress"
                            id="second-ring"
                            cx="80"
                            cy="80"
                            r="72">
                        </circle>

                    </svg>

                    <div class="ticks" id="second-ticks"></div>

                    <div class="moving-dot"></div>

                    <div class="clock-content">

                        <span class="clock-value" id="seconds">
                            00
                        </span>

                        <span class="clock-label">
                            SECONDS
                        </span>

                    </div>

                </div>

            </div>

        </section>


        <!-- AM PM -->
        <div class="ampm-container">

            <span class="status-dot"></span>

            <span id="ampm">
                AM
            </span>

            <span class="status-dot"></span>

        </div>


        <!-- Footer Features -->
        <section class="features">

            <div class="feature">

                <div class="feature-icon">
                    ◷
                </div>

                <div>
                    <span>REAL TIME</span>
                    <small>ACCURATE</small>
                </div>

            </div>


            <div class="feature">

                <div class="feature-icon">
                    ⚡
                </div>

                <div>
                    <span>SMOOTH</span>
                    <small>60 FPS</small>
                </div>

            </div>


            <div class="feature">

                <div class="feature-icon">
                    ✦
                </div>

                <div>
                    <span>MODERN</span>
                    <small>NEON UI</small>
                </div>

            </div>


            <div class="feature">

                <div class="feature-icon">
                    ◉
                </div>

                <div>
                    <span>RESPONSIVE</span>
                    <small>ALL DEVICES</small>
                </div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
